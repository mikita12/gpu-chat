<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPU Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; background: #111; color: #eee; }
  #chat { display: flex; flex-direction: column; gap: 0.75rem; min-height: 60vh; margin-bottom: 1rem; }
  .msg { padding: 0.6rem 0.9rem; border-radius: 10px; max-width: 80%; white-space: pre-wrap; line-height: 1.4; }
  .user { align-self: flex-end; background: #2b5fd9; }
  .assistant { align-self: flex-start; background: #2a2a2a; }
  form { display: flex; gap: 0.5rem; }
  textarea { flex: 1; resize: none; font-family: inherit; font-size: 1rem; padding: 0.5rem; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #eee; }
  button { padding: 0 1.2rem; border-radius: 8px; border: none; background: #2b5fd9; color: white; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  select { padding: 0.4rem 0.6rem; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #eee; font-size: 0.95rem; max-width: 100%; }
  #status { font-size: 0.85rem; color: #999; margin: -0.5rem 0 1rem; }
</style>
</head>
<body>
<div class="topbar">
  <h2>giga2 GPU chat</h2>
  <select id="model"><option>loading models...</option></select>
</div>
<div id="status"></div>
<div id="chat"></div>
<form id="form">
  <textarea id="input" rows="2" placeholder="Type a message..."></textarea>
  <button type="submit" id="send">Send</button>
</form>
<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelSelect = document.getElementById('model');
const statusEl = document.getElementById('status');
let messages = [];
let loadedModel = null;

function setStatus() {
  statusEl.textContent = loadedModel
    ? `Currently loaded in GPU memory: ${loadedModel}`
    : 'No model currently loaded in GPU memory (first message on any model will take longer to load).';
}

async function refreshLoaded() {
  try {
    const res = await fetch('/api/loaded');
    const data = await res.json();
    loadedModel = data.loaded[0] || null;
    setStatus();
    return data;
  } catch (err) {
    return null;
  }
}

(async function init() {
  try {
    const [namesRes, loadedData] = await Promise.all([
      fetch('/api/models').then((r) => r.json()),
      refreshLoaded(),
    ]);
    modelSelect.innerHTML = '';
    for (const name of namesRes) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      modelSelect.appendChild(opt);
    }
    const fallback = loadedData && loadedData.default;
    const preferred = loadedModel || fallback;
    if (preferred && namesRes.includes(preferred)) {
      modelSelect.value = preferred;
    }
  } catch (err) {
    modelSelect.innerHTML = '<option>failed to load models</option>';
  }
})();

modelSelect.addEventListener('change', () => {
  if (loadedModel && modelSelect.value !== loadedModel) {
    const ok = confirm(
      `"${loadedModel}" is currently loaded in GPU memory. Switching to "${modelSelect.value}" will unload it and load the new one instead — this can take anywhere from several seconds to over a minute depending on model size.\n\n` +
      `Anyone else currently chatting with "${loadedModel}" will have their next reply wait for this reload too, since only one model fits in memory at a time.\n\n` +
      `Continue?`
    );
    if (!ok) {
      modelSelect.value = loadedModel;
    }
  }
});

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  messages.push({ role: 'user', content: text });
  addMessage('user', text);
  const assistantDiv = addMessage('assistant', '');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, model: modelSelect.value }),
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch {}
      assistantDiv.textContent = `[error: ${detail}]`;
      messages.pop();
      refreshLoaded();
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let full = '';
    let sawOutput = false;
    assistantDiv.textContent = 'loading model…';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 1);
        if (!line) continue;
        const evt = JSON.parse(line);
        if (evt.type === 'content') {
          sawOutput = true;
          full += evt.text;
          assistantDiv.textContent = full;
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (evt.type === 'error') {
          sawOutput = true;
          assistantDiv.textContent = full ? `${full}\n\n[error: ${evt.message}]` : `[error: ${evt.message}]`;
        }
        // 'ping'/'done'/'queued' events don't need to change the displayed text.
      }
    }
    if (!sawOutput) assistantDiv.textContent = '';
    messages.push({ role: 'assistant', content: full });
    refreshLoaded();
  } catch (err) {
    assistantDiv.textContent = '[error: ' + err + ']';
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
